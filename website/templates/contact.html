<div class="mx-5 my-5">
    <div>
        <div>
            <p class="fs-2 fw-bold">
                Contact
            </p>
            <p class="fs-5">
                Donec ullamcorper nulla con metus auctor fringilla. Vestibulum id ligula porta felis euismod semper.
                Praesent commodo cursus
                magna, vel scelerisque nisl consectetur. Fusce dapibus, tellus ac cursus commodo.
            </p>
        </div>
    </div>
    <div class="row">
        <div class="col-8 mx-auto p-2 container-fluid" >

            <form class="rounded-2 pb-4 pt-3 px-2 border border-secondary-subtle" style="background-color: rgb(240, 240, 240);">
                <div class="row mb-3">
                    <div class="col-lg-3 col-md-3 col-sm-12 d-flex justify-content-end">
                        <label for="exampleInputEmail1" class="form-label fw-bold">Your email</label>

                    </div>
                    <div class="col-lg-9 col-md-9 col-sm-12">
                        <input type="email" class="form-control" placeholder="Your email" id="exampleInputEmail1" aria-describedby="emailHelp">
                    </div>
                </div>
                <div class="row form-floating">
                    <div class="col-md-3 col-sm-12 d-flex justify-content-end fw-bold">
                        <label for="floatingTextarea" class="form-label">Your message</label>

                    </div>
                    <div class="col-md-9 col-sm-12">

                        <textarea class="form-control" placeholder="Please enter your message here..."
                            id="floatingTextarea"  style="height: 100px"></textarea>
                    </div>
                </div>
                <div class="d-flex justify-content-end mt-3">

                    <button type="submit" class="btn btn-primary btn-lg rounded-5">Submit</button>
                </div>
            </form>
        </div>

    </div>




</div>
